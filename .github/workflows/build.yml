name: Build Kernel

on:
  # Runs on the 1st of every month
  schedule:
    - cron: "17 3 1 * *"

  workflow_dispatch:
    inputs:
      device:
        description: "Device to build. Leave EMPTY to build ALL devices."
        required: false
        type: string
        default: ""
      create_release:
        description: "Create a GitHub Release after build"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  set-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      do_release: ${{ steps.gen.outputs.do_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: gen
        env:
          DEVICE_INPUT: ${{ inputs.device }}
          EVENT_NAME: ${{ github.event_name }}
          CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ -z "$DEVICE_INPUT" ]; then
            echo "→ Building ALL devices (event=$EVENT_NAME, device input='$DEVICE_INPUT')"
            mapfile -t FILES < <(ls devices/*.json)
          else
            DEVICE_JSON="devices/${DEVICE_INPUT}.json"
            if [ ! -f "$DEVICE_JSON" ]; then
              echo "::error::Device '$DEVICE_INPUT' not found. Available: $(ls devices/*.json | xargs -n1 basename | sed 's/\.json//' | tr '\n' ' ')"
              exit 1
            fi
            FILES=("$DEVICE_JSON")
            echo "→ Building single device: $DEVICE_INPUT"
          fi

          INCLUDE="[]"
          for f in "${FILES[@]}"; do
            DEVICE_KEY=$(jq -r 'keys[0]' "$f")
            ENTRY=$(jq -c --arg d "$DEVICE_KEY" '[.[$d].variants[] | {device: $d, variant: .}]' "$f")
            INCLUDE=$(jq -c -n --argjson a "$INCLUDE" --argjson b "$ENTRY" '$a + $b')
          done

          MATRIX=$(jq -c -n --argjson inc "$INCLUDE" '{include: $inc}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "→ Matrix: $MATRIX"

          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_release=$CREATE_RELEASE" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: set-matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: builder

      - name: Set up swap space
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c  # v1.0
        with:
          swap-size-gb: 10

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio flex bison libssl-dev \
            libelf-dev dwarves zip curl git python3 rsync jq ccache

      - name: Read device config
        id: devcfg
        run: |
          DEVICE_JSON="builder/devices/${{ matrix.device }}.json"
          {
            echo "kernel_repo=$(jq -r '.["'"${{ matrix.device }}"'"].kernel_repo' "$DEVICE_JSON")"
            echo "kernel_branch=$(jq -r '.["'"${{ matrix.device }}"'"].kernel_branch' "$DEVICE_JSON")"
            echo "clang_version=$(jq -r '.["'"${{ matrix.device }}"'"].clang_version' "$DEVICE_JSON")"
            echo "kernel_version=$(jq -r '.["'"${{ matrix.device }}"'"].kernel_version' "$DEVICE_JSON")"
          } >> "$GITHUB_OUTPUT"

      - name: Clone kernel source
        run: |
          set -euo pipefail
          source builder/scripts/common.sh
          clone_with_retry "${{ steps.devcfg.outputs.kernel_repo }}" "${{ steps.devcfg.outputs.kernel_branch }}" kernel_src

      # Persists the extracted clang toolchain across CI runs
      - name: Cache toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: kernel_src/toolchain/clang-${{ steps.devcfg.outputs.clang_version }}
          key: toolchain-clang-${{ steps.devcfg.outputs.clang_version }}

      # Persists ccache's object cache across CI runs
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d  # v1.2.24
        with:
          key: ccache-${{ matrix.device }}-${{ matrix.variant }}
          max-size: 2G
          create-symlink: false

      - name: Stage builder files into kernel source
        run: |
          cp -r builder/devices kernel_src/
          cp -r builder/scripts kernel_src/
          cp builder/config.env kernel_src/

      # Catches a wrong kernel_version in devices/*.json
      - name: Preflight — verify declared kernel version
        working-directory: kernel_src
        run: |
          set -euo pipefail
          source scripts/common.sh
          verify_kernel_version "${{ steps.devcfg.outputs.kernel_version }}"

      - name: Build (${{ matrix.device }} / ${{ matrix.variant }})
        working-directory: kernel_src
        run: |
          set -euo pipefail
          source config.env
          source scripts/env.sh "${{ matrix.device }}"
          bash scripts/variant.sh "${{ matrix.device }}" "${{ matrix.variant }}"
          bash scripts/compile.sh "${{ matrix.device }}" "${{ matrix.variant }}"

      - name: Package patch rejects (on failure)
        if: failure()
        working-directory: kernel_src
        run: |
          find . -path ./.zincore_deps -prune -o -name '*.rej' -print0 > ../rejects.list
          if [ -s ../rejects.list ]; then
            tar -czf ../patch-rejects.tar.gz --null -T ../rejects.list
          fi

      - name: Upload patch rejects
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: zincore-${{ matrix.device }}-${{ matrix.variant }}-rejects
          path: patch-rejects.tar.gz
          if-no-files-found: ignore

      - name: Diagnose known build failures
        if: failure()
        working-directory: kernel_src
        run: |
          LOG="${{ matrix.device }}-${{ matrix.variant }}-build.log"
          if [ -f "$LOG" ]; then
            if grep -q "You disabled CONFIG_KALLSYMS_ALL" "$LOG"; then
              echo "::error::Known issue — BakaSU static-symbol export missing/incomplete. Check ksu.sh's unstatic() block and CONFIG_KALLSYMS/CONFIG_KALLSYMS_ALL."
            fi
            if grep -q "static_export_check.mk" "$LOG"; then
              echo "::error::BakaSU integration check failed — kernel not properly integrated. See https://bakasu.org/guide/manual-integrate"
            fi
          else
            echo "::warning::Build log not found, cannot run diagnosis."
          fi

      - name: Upload flashable zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: zincore-${{ matrix.device }}-${{ matrix.variant }}
          path: kernel_src/zincore-*.zip
          if-no-files-found: error

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: debug-${{ matrix.device }}-${{ matrix.variant }}
          path: |
            kernel_src/*-build.log
            kernel_src/*-config
          if-no-files-found: warn

      - name: Upload KSU version info
        if: matrix.variant == 'ksu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: zincore-${{ matrix.device }}-${{ matrix.variant }}-versions
          path: |
            kernel_src/${{ matrix.device }}-bakasu-version.txt
            kernel_src/${{ matrix.device }}-susfs-version.txt
            kernel_src/${{ matrix.device }}-bakasu-managers.txt
          if-no-files-found: error

  release:
    needs: [set-matrix, build]
    if: ${{ needs.set-matrix.outputs.do_release == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: zincore-*
          path: release_files

      - name: Flatten artifact folders
        run: |
          mkdir -p final
          find release_files -type f -exec mv {} final/ \;

      - name: Compose release notes
        run: |
          {
            echo "> [!NOTE]"
            # All devices share one globally-pinned BakaSU/SuSFS commit
            # (config.env) — so their version strings SHOULD be identical
            # across every device. We verify that instead of assuming it:
            # if they ever diverge, something is wrong and needs looking at.
            BAKASU_UNIQUE=$(cat final/*-bakasu-version.txt 2>/dev/null | sort -u)
            SUSFS_UNIQUE=$(cat final/*-susfs-version.txt 2>/dev/null | sort -u)
            MANAGERS_UNIQUE=$(cat final/*-bakasu-managers.txt 2>/dev/null | sort -u)

            BAKASU_LINES=$(echo "$BAKASU_UNIQUE" | grep -c . || true)
            SUSFS_LINES=$(echo "$SUSFS_UNIQUE" | grep -c . || true)

            if [ "$BAKASU_LINES" -gt 1 ]; then
              echo "::warning::BakaSU version differs across devices despite a single global pin — investigate: $(echo "$BAKASU_UNIQUE" | tr '\n' ' ')" >&2
            fi
            if [ "$SUSFS_LINES" -gt 1 ]; then
              echo "::warning::SuSFS version differs across devices despite a single global pin — investigate: $(echo "$SUSFS_UNIQUE" | tr '\n' ' ')" >&2
            fi

            [ -n "$BAKASU_UNIQUE" ] && echo "> BakaSU Version: $(echo "$BAKASU_UNIQUE" | head -1)"
            [ -n "$SUSFS_UNIQUE" ] && echo "> SuSFS Version: $(echo "$SUSFS_UNIQUE" | head -1)"
            [ -n "$MANAGERS_UNIQUE" ] && echo "> Supported Managers: $(echo "$MANAGERS_UNIQUE" | head -1)"
            echo ""
            echo "> [!CAUTION]"
            echo "> - Always back up your boot image (and dtbo, if your device has one) before flashing!"
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          gh release create "zincore-${DATE}-${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --title "Build - ${DATE}" \
            --notes-file release_notes.md \
            final/*.zip
